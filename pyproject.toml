[project]
name = "tmg-cqa-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openai>=3.23.0",
    "pypdf[crypto]>=6.19.0",
    "zstandard>=0.25.0",
]

[project.scripts]
tmg-cqa-eval = "tmg_cqa_eval.evaluate:main"
tmg-cqa-prepare = "tmg_cqa_eval.prepare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]
